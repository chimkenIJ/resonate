<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan Indoors</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F0EB}a:hover{color:#FFFFFF}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121314; color: #F2F0EB; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px; background: #2B2E33"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px; background: #353840; clip-path: polygon(0 0, 36% 30%, 36% 62%, 0 100%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px; background: #30333A; clip-path: polygon(100% 0, 64% 30%, 64% 62%, 100% 100%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px; background: #3F4249; clip-path: polygon(36% 62%, 64% 62%, 100% 100%, 0 100%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 172px; top: 196px; width: 46px; height: 126px; background: #23262B; border-radius: 4px 4px 0 0"></div>
  <div aria-hidden="true" style="position: absolute; left: 252px; top: 380px; width: 70px; height: 70px; background: #4A4D55; border-radius: 10px"></div>

  <div style="position: absolute; left: 6px; top: 110px; width: 120px; height: 380px; border: 4px solid #7E9CC4; border-radius: 18px; box-sizing: border-box"></div>
  <span style="position: absolute; left: 20px; top: 124px; background: #7E9CC4; color: #121314; font-weight: 800; font-size: 15px; padding: 7px 12px; border-radius: 12px">Wall · 1 m</span>

  <div style="position: absolute; left: 164px; top: 188px; width: 62px; height: 142px; border: 4px solid #8FAE8B; border-radius: 14px; box-sizing: border-box"></div>
  <span style="position: absolute; left: 150px; top: 150px; background: #8FAE8B; color: #121314; font-weight: 800; font-size: 15px; padding: 7px 12px; border-radius: 12px">Door · 6 m</span>

  <div style="position: absolute; left: 242px; top: 370px; width: 90px; height: 90px; border: 4px solid #C9785D; border-radius: 16px; box-sizing: border-box"></div>
  <span style="position: absolute; left: 236px; top: 332px; background: #C9785D; color: #121314; font-weight: 800; font-size: 15px; padding: 7px 12px; border-radius: 12px">Chair · 2 m</span>

  <div style="position: absolute; left: 0; top: 0; width: 390px; padding: 58px 20px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.html" aria-label="Back to home" style="width: 60px; height: 60px; border-radius: 30px; background: #1C1D1F; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <span style="display: flex; align-items: center; gap: 8px; background: #1C1D1F; border-radius: 999px; padding: 16px 20px; font-size: 16px; font-weight: 800">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #8FAE8B"></span>Scanning room
    </span>
  </div>

  <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; background: #1C1D1F; border: 1px solid #333538; border-radius: 34px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 16px; align-items: center">
      <svg aria-hidden="true" width="96" height="96" viewBox="0 0 96 96" style="flex-shrink: 0">
        <rect width="96" height="96" rx="20" fill="#2A2C30"></rect>
        <rect x="10" y="10" width="8" height="76" rx="3" fill="#7E9CC4"></rect>
        <rect x="40" y="8" width="18" height="6" rx="2" fill="#8FAE8B"></rect>
        <rect x="58" y="44" width="16" height="16" rx="4" fill="#C9785D"></rect>
        <path d="M42 78 L48 70 L54 78 Z" fill="#F2F0EB"></path>
        <circle cx="48" cy="78" r="18" fill="none" stroke="#45484D" stroke-width="1.5" stroke-dasharray="3 4"></circle>
      </svg>
      <span style="font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em">Chair 2 steps ahead, on your right.</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; background: #2A2C30; border-radius: 22px; padding: 14px 16px">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #D9B26A; color: #121314; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </span>
      <span style="font-size: 18px; font-weight: 600; line-height: 1.3">Walk straight. Wall stays on your left. Door is open ahead.</span>
    </div>
    <div style="display: flex; gap: 10px">
      <button type="button" style="flex: 1 1 0; height: 64px; border-radius: 32px; border: 0; background: #2A2C30; color: #F2F0EB; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Repeat</button>
      <button type="button" style="flex: 1.4 1 0; height: 64px; border-radius: 32px; border: 0; background: #F2F0EB; color: #121314; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">Describe room</button>
    </div>
  </div>
</div>


</body>
</html>

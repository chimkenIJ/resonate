<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personalize AccessAble</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F0EB}a:hover{color:#FFFFFF}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121314; color: #F2F0EB; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; padding: 62px 20px 28px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

  <div style="display: flex; gap: 6px">
    <span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #F2F0EB"></span>
    <span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #F2F0EB"></span>
    <span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #333538"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 16px; font-weight: 700; color: #B4B1AA">Step 2 of 3</span>
    <span style="font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em">What should we help with?</span>
    <span style="font-size: 17px; font-weight: 600; color: #CFCCC5">Pick any. You can change this anytime.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button type="button" aria-pressed="true" style="min-height: 80px; border-radius: 24px; border: 2px solid #8FAE8B; background: #1C1D1F; color: #F2F0EB; font-family: inherit; text-align: left; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: #8FAE8B; color: #121314; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 19px; font-weight: 800">Getting around</span>
        <span style="font-size: 15px; font-weight: 600; color: #B4B1AA">Obstacles and routes</span>
      </span>
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #8FAE8B; color: #121314; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </span>
    </button>
    <button type="button" aria-pressed="false" style="min-height: 80px; border-radius: 24px; border: 2px solid #2A2C30; background: #1C1D1F; color: #F2F0EB; font-family: inherit; text-align: left; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: #A99AC9; color: #121314; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"></circle><circle cx="17.5" cy="10.5" r="1.5"></circle><circle cx="8.5" cy="7.5" r="1.5"></circle><circle cx="6.5" cy="12.5" r="1.5"></circle><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a6 6 0 0 0 6-6c0-4.9-4.5-8.6-10-8.6z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 19px; font-weight: 800">Telling colors apart</span>
        <span style="font-size: 15px; font-weight: 600; color: #B4B1AA">Name any color you point at</span>
      </span>
      <span style="width: 32px; height: 32px; border-radius: 16px; border: 2px solid #6A6D72; box-sizing: border-box"></span>
    </button>
    <button type="button" aria-pressed="false" style="min-height: 80px; border-radius: 24px; border: 2px solid #2A2C30; background: #1C1D1F; color: #F2F0EB; font-family: inherit; text-align: left; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: #7E9CC4; color: #121314; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 19px; font-weight: 800">Signing</span>
        <span style="font-size: 15px; font-weight: 600; color: #B4B1AA">ASL to text and speech</span>
      </span>
      <span style="width: 32px; height: 32px; border-radius: 16px; border: 2px solid #6A6D72; box-sizing: border-box"></span>
    </button>
  </div>

  <span style="font-size: 20px; font-weight: 800; margin-top: 4px">How should alerts reach you?</span>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button type="button" aria-pressed="true" style="height: 64px; border-radius: 22px; border: 0; background: #D9B26A; color: #121314; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Voice</button>
    <button type="button" aria-pressed="true" style="height: 64px; border-radius: 22px; border: 0; background: #C9785D; color: #121314; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Buzzes</button>
    <button type="button" aria-pressed="false" style="height: 64px; border-radius: 22px; border: 2px solid #333538; background: #1C1D1F; color: #F2F0EB; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Tones</button>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Main.html" style="height: 64px; border-radius: 32px; background: #F2F0EB; color: #121314; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>


</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AccessAble Home</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F0EB}a:hover{color:#FFFFFF}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121314; color: #F2F0EB; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; padding: 64px 20px 40px; display: flex; flex-direction: column; gap: 28px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em">AccessAble</span>
    <a href="Setup.html" aria-label="Settings" style="width: 60px; height: 60px; border-radius: 30px; background: #1C1D1F; border: 2px solid #333538; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
    </a>
  </div>

  <button type="button" aria-label="Where do you want to go? Tap, then say a place" style="height: 156px; border-radius: 32px; border: 0; background: #F2F0EB; color: #121314; font-family: inherit; text-align: left; padding: 24px; display: flex; align-items: center; gap: 20px; cursor: pointer">
    <span style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
      <span style="font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em">Where do you want to go?</span>
      <span style="font-size: 18px; font-weight: 600; color: #3D3A35">Tap, then say a place</span>
    </span>
    <span style="width: 80px; height: 80px; border-radius: 40px; background: #121314; color: #F2F0EB; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
    </span>
  </button>

  <div style="display: flex; flex-direction: column; gap: 20px">
    <a href="Detect.html" style="height: 128px; border-radius: 30px; background: #1C1D1F; border: 2px solid #D9B26A; box-sizing: border-box; padding: 0 22px; display: flex; align-items: center; gap: 20px; text-decoration: none">
      <span style="width: 72px; height: 72px; border-radius: 36px; background: #D9B26A; color: #121314; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 26px; font-weight: 800">Walk outside</span>
        <span style="font-size: 17px; font-weight: 600; color: #CFCCC5">Warns you about obstacles</span>
      </span>
    </a>
    <a href="Indoors.html" style="height: 128px; border-radius: 30px; background: #1C1D1F; border: 2px solid #8FAE8B; box-sizing: border-box; padding: 0 22px; display: flex; align-items: center; gap: 20px; text-decoration: none">
      <span style="width: 72px; height: 72px; border-radius: 36px; background: #8FAE8B; color: #121314; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 26px; font-weight: 800">Scan indoors</span>
        <span style="font-size: 17px; font-weight: 600; color: #CFCCC5">Finds walls, doors, and things</span>
      </span>
    </a>
    <a href="Saved.html" style="height: 128px; border-radius: 30px; background: #1C1D1F; border: 2px solid #7E9CC4; box-sizing: border-box; padding: 0 22px; display: flex; align-items: center; gap: 20px; text-decoration: none">
      <span style="width: 72px; height: 72px; border-radius: 36px; background: #7E9CC4; color: #121314; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 26px; font-weight: 800">Saved places</span>
        <span style="font-size: 17px; font-weight: 600; color: #CFCCC5">Classes, home, and more</span>
      </span>
    </a>
  </div>
</div>

</html>
